name: Android test build

# A push to main that touches the Android app or the shared Rust core builds a
# signed release APK and hands it to testers through Firebase App Distribution
# (project inbox2-497321). Same pattern as the other apps: upload key from
# secrets, never a debug-key fallback.
#
# Secrets:
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD — the upload key (alias `upload`)
#   FIREBASE_SERVICE_ACCOUNT_JSON — service account with Firebase App Distribution Admin
#   FIREBASE_ANDROID_APP_ID — 1:…:android:… from google-services.json
#   FIREBASE_TESTERS — comma-separated tester addresses (a secret, so it stays out of logs)

on:
  push:
    branches: [main]
    paths:
      - "ui/android/**"
      - "ui/desktop/core/**"
      - "packages/email-body/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-distribution
  cancel-in-progress: true

jobs:
  distribute:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # A rising code per build; offset past any build made before CI.
      VERSION_CODE: ${{ github.run_number }}0
    steps:
      # The job holds a three-ABI Rust build and an R8 release build; the
      # runner's preinstalled toolchains we don't use leave too little disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h / && free -m

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      # Restored here and saved right after the core build, before the
      # intermediates are dropped (a post-job save would store an empty target).
      - name: Restore the Rust cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/desktop/target
          key: android-core-${{ hashFiles('ui/desktop/Cargo.lock') }}-${{ github.sha }}
          restore-keys: android-core-${{ hashFiles('ui/desktop/Cargo.lock') }}-
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Rust core (.so per ABI + Kotlin bindings)
        run: |
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          bash ui/desktop/core/build-android-jni.sh

      - name: Save the Rust cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/desktop/target
          key: android-core-${{ hashFiles('ui/desktop/Cargo.lock') }}-${{ github.sha }}

      # Only the outputs are needed from here on; the intermediates are GBs.
      - name: Drop the Rust intermediates
        run: |
          find ui/desktop/target -mindepth 1 -maxdepth 1 ! -name android-jniLibs ! -name uniffi-kotlin -exec rm -rf {} +
          df -h /

      - name: email-body bundle
        run: |
          corepack enable
          yarn --cwd ui/web install --frozen-lockfile --ignore-scripts
          bin/android bundle

      - name: Upload key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > ui/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=upload
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          EOF

      - name: assembleRelease
        working-directory: ui/android
        run: |
          export VERSION_NAME="$(../../bin/version)"
          # Kotlin in Gradle's own process, so one JVM holds the memory, not two.
          ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="-Xmx5g -Dfile.encoding=UTF-8" :app:assembleRelease \
            || { df -h /; free -m; exit 1; }
          ls -la app/build/outputs/apk/release/

      - name: Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@14 appdistribution:distribute \
            ui/android/app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --release-notes "$(git log -1 --format='%h %s')" \
            --testers "$FIREBASE_TESTERS"
