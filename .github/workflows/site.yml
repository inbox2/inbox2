name: Site

# The Cloudflare Pages sites, every push to main (Pushleft production deploys in
# ci.yml, after the tests). Its own workflow: CI cancels an older run, and a
# cancelled run here could skip a website/ change.
#
#   deploy:site (mail.inbox2.com) → Pages project `inbox2`
#   deploy:site (inbox2.com)      → Pages project `inbox2-marketing`, only
#                                   when website/ changed
#
# Secrets: CLOUDFLARE_API_TOKEN (Pages:Edit), CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-site:
    name: deploy:site (mail.inbox2.com)
    runs-on: ubuntu-24.04
    concurrency:
      group: pages-web
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - name: Build (prod API origin baked in via --mode pages)
        working-directory: ui/web
        env:
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          yarn build:pages
      - name: Deploy to Cloudflare Pages
        working-directory: ui/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist --project-name=inbox2 --branch=main --commit-dirty=true

  # The change check runs outside the concurrency group: only a push that did
  # change website/ queues a deploy, so a later unrelated push can never take
  # the place of a pending one (GitHub replaces pending jobs in a group).
  website-changed:
    runs-on: ubuntu-24.04
    outputs:
      yes: ${{ steps.changed.outputs.yes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did website/ change in this push?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # The whole push, not only its last commit. A first push (no usable
          # before SHA) or a manual run deploys.
          if [ "${{ github.event_name }}" = workflow_dispatch ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             || ! git diff --quiet "$BEFORE" HEAD -- website/; then
            echo "yes=1" >> "$GITHUB_OUTPUT"
          fi

  deploy-site-website:
    name: deploy:site (inbox2.com)
    needs: website-changed
    if: needs.website-changed.outputs.yes
    runs-on: ubuntu-24.04
    concurrency:
      group: pages-website
      cancel-in-progress: false
    steps:
      # Always the newest main, not this push's commit: deploys can finish out
      # of order, and each one then publishes the latest site anyway.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build + deploy
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn deploy
