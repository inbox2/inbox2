<!-- An MJML-generated transactional email (Temu "order shipped"). MJML pins the layout
     with inline pixel widths on the section wrappers (width:574.8px / min-width:574.8px)
     nested inside width:100% tables, and sizes fonts/buttons for a ~600px column. On a
     phone the body laid out at ~600px and clipped the right side. The reader scales the
     whole email down to fit the viewport (Gmail's mobile behaviour), keeping fonts and
     proportions — the layout harness asserts the scaled result fits (noOverflow). -->
<div style="background:#f9f9f9;margin:0 auto;max-width:600px">
  <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%">
    <tbody><tr><td style="direction:ltr;font-size:0;padding:0 12.6px 0 12.6px;text-align:center">
      <div class="section-class" style="margin:0 auto;max-width:576px;width:574.8px;min-width:574.8px">
        <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:574.8px;min-width:574.8px">
          <tbody><tr><td style="border:none;direction:ltr;font-size:0;padding:0;text-align:center">
            <div class="mj-column-per-100" style="font-size:0;text-align:left;direction:ltr;display:inline-block;vertical-align:top;width:100%">
              <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="vertical-align:top" width="100%">
                <tbody>
                  <tr><td style="font-size:0;padding:10px 25px;word-break:break-word">
                    <img src="https://t.temu.example/logo.png" width="120" height="48" style="width:120px" alt="TEMU">
                  </td></tr>
                  <tr><td align="left" style="font-size:0;padding:10px 25px;word-break:break-word">
                    <div style="font-family:Arial;font-size:20px;line-height:1.4;text-align:left;color:#222">Order shipped and tracking number ready</div>
                    <p>Hi wa**em,</p>
                    <p>Your order has been shipped and the tracking number is ready. The DHL Parcel
                       tracking number is JVGL06289524002116480146. You can click the button below to
                       check your delivery status or see more details.</p>
                  </td></tr>
                </tbody>
              </table>
            </div>
          </td></tr></tbody>
        </table>
      </div>
    </td></tr></tbody>
  </table>
</div>
