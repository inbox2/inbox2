# A recursive resolver for rspamd alone (local.d/options.inc). Spamhaus and
# DNSWL refuse queries that arrive through a shared resolver (answer
# 127.255.255.254), and the container's Docker DNS forwards to Pushleft's;
# rspamd then disabled every Spamhaus/DNSWL rule (found 2026-11-17).
# Asked straight from the node's address, they answer.
# Runs as the image user on a read-only root: unprivileged port, no pidfile,
# no chroot, no DNSSEC trust-anchor file to write.
server:
  interface: 127.0.0.1
  port: 5353
  do-ip6: no
  access-control: 127.0.0.0/8 allow
  do-daemonize: no
  username: ""
  chroot: ""
  directory: ""
  pidfile: ""
  logfile: ""
  use-syslog: no
  verbosity: 0
  module-config: "iterator"
  prefetch: yes
  so-sndbuf: 0
  so-rcvbuf: 0
