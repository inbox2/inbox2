# The bayes store is the managed Valkey (data.valkey, login rspamd). The rspamd
# role's command writes its address and password to this file at start.
# The training came along: the old redis's 6874 keys were dumped before this
# switch and loaded into the Valkey with a logical copy (Redis 8.0's RDB does
# not load into Valkey 8.1), then checked by key count (2026-11-17).
.include(try=true,priority=1,duplicate=merge) "/run/rspamd/valkey.conf"
