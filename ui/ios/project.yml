name: Inbox2
options:
  bundleIdPrefix: com.inbox2
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

# The build number: 1 by default; bin/ios-publish-ipad overrides it per publish so
# each OTA install is a newer build (TestFlight sets its own on upload).
settings:
  base:
    CURRENT_PROJECT_VERSION: "1"

targets:
  Inbox2:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      # Cross-process hand-off helper shared with the ShareExtension target (App Group).
      - path: Shared
      # Mail Live Activity attributes + App Intent, shared with the Inbox2Widgets target.
      - path: LiveActivity
      # Vendored sherpa-onnx Swift API helper (free-lane Kokoro TTS). The xcframeworks
      # it links are fetched by bin/fetch-sherpa-onnx (gitignored); the .h alongside it
      # is the Swift↔C bridging header (a header, not a compiled source).
      - path: Vendor/swift
    # The space-shooter Bridge game is native SceneKit (Sources/Game/) — no web bundle
    # step. (DropBlock remains a web/desktop-only game; it was removed from iOS.)
    info:
      path: Inbox2-Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Inbox2
        # Mail Live Activity (Sources/MailLiveActivity.swift + Inbox2Widgets).
        NSSupportsLiveActivities: true
        # Communication notifications (sender icon inline) need the intent declared.
        NSUserActivityTypes: [INSendMessageIntent]
        # inbox2://conversation/<key> — the Live Activity card's tap target.
        CFBundleURLTypes:
          - CFBundleURLName: com.inbox2.ios
            CFBundleURLSchemes: [inbox2]
        # Dark launch screen (brand bg) so the OS-drawn launch is seamless with the
        # animated splash (LaunchSplash) — no white flash before SwiftUI mounts.
        # LaunchBackground is a color set in Assets.xcassets (#090A0E).
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Export compliance: declared exempt by Waseem, 2026-11-08 (docs/iOS-TestFlight.md).
        ITSAppUsesNonExemptEncryption: false
        # App Store validation refuses a bundle with no orientations, and iPad
        # multitasking needs all four. iPhone keeps the system default.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Alternate app icons (Settings -> Theme -> App icon). Alternate icons cannot
        # live in the asset catalog: iOS only reads loose PNGs from the bundle root,
        # generated by brand/make-alt-icons.py. The primary icon still comes from
        # Assets.xcassets; AppIcon-classic here is only the picker thumbnail for it.
        CFBundleIcons:
          CFBundleAlternateIcons:
            sun:
              CFBundleIconFiles: [AppIcon-sun]
              UIPrerenderedIcon: false
            vennlight:
              CFBundleIconFiles: [AppIcon-vennlight]
              UIPrerenderedIcon: false
            graffiti:
              CFBundleIconFiles: [AppIcon-graffiti]
              UIPrerenderedIcon: false
            groovebox:
              CFBundleIconFiles: [AppIcon-groovebox]
              UIPrerenderedIcon: false
        # The iPad reads this key instead of CFBundleIcons: no alternates here, no
        # alternate icons on iPad (and App Store warning ITMS-90892).
        CFBundleIcons~ipad:
          CFBundleAlternateIcons:
            sun:
              CFBundleIconFiles: [AppIcon-sun76x76, AppIcon-sun83.5x83.5]
              UIPrerenderedIcon: false
            vennlight:
              CFBundleIconFiles: [AppIcon-vennlight76x76, AppIcon-vennlight83.5x83.5]
              UIPrerenderedIcon: false
            graffiti:
              CFBundleIconFiles: [AppIcon-graffiti76x76, AppIcon-graffiti83.5x83.5]
              UIPrerenderedIcon: false
            groovebox:
              CFBundleIconFiles: [AppIcon-groovebox76x76, AppIcon-groovebox83.5x83.5]
              UIPrerenderedIcon: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          # CarPlay scene (Phase 2). SwiftUI manages the phone window scene implicitly;
          # this only adds the CarPlay template scene, driven by CarPlaySceneDelegate.
          # Inert until the Apple-managed carplay-communication entitlement is granted +
          # added to Inbox2.entitlements — iOS won't instantiate the scene without it, so
          # the phone app and device signing are unaffected.
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UIAppFonts:
          # Atelier/Soirée theme faces (SIL OFL variable TTFs) — AppFont.luxe.
          - Jost.ttf
          - BodoniModa.ttf
          # Groovebox theme faces (SIL OFL variable TTFs) — AppFont.Faces.groovebox.
          - Figtree.ttf
          - Rubik.ttf
        # Background refresh: iOS wakes us periodically to sync; the core's post-sync
        # rule scan emits new-message, which becomes a local notification. APNs adds
        # remote-notification: a silent channel_sync push from the API triggers the
        # same sync immediately (docs/Cloud-Push.md "Mobile push"); BGAppRefresh
        # remains the fallback when silent pushes are throttled.
        UIBackgroundModes:
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.inbox2.refresh
        # OAuth onboarding talks to the dev Rails server over http://localhost and
        # catches the consent redirect on http://127.0.0.1 (loopback) — both are
        # cleartext, so allow local networking (does not weaken HTTPS elsewhere).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Dev: a physical device reaches the dev Rails server over the tailnet by
          # the Mac's Tailscale name on plaintext http:4000 (see AppConfig). The hop
          # is already encrypted by Tailscale/WireGuard, so allow cleartext for just
          # this host — it does not weaken HTTPS anywhere else.
          NSExceptionDomains:
            seem.tailbca3e8.ts.net:
              NSExceptionAllowsInsecureHTTPLoads: true
        # The Bridge cockpit listens to the mic for push-to-talk voice commands.
        NSMicrophoneUsageDescription: Inbox2 listens while you hold the Bridge orb so you can talk to your team by voice.
        # Push-to-talk transcription runs on-device (Speech framework).
        NSSpeechRecognitionUsageDescription: Inbox2 transcribes what you say to the Bridge orb, on-device, to act on your voice commands.
        # Compose → Attach → Camera. (Attach → Photos needs no key: PhotosPicker runs
        # out-of-process and hands back only what the user picked.)
        NSFaceIDUsageDescription: Inbox2 uses Face ID to unlock your key for sealed mail.
        NSCameraUsageDescription: Inbox2 opens the camera when you attach a photo to a message you're writing.
    # APNs (docs/Cloud-Push.md "Mobile push"). Debug builds run against the
    # development (sandbox) APNs gateway; archive/distribution signing flips
    # aps-environment to production automatically.
    entitlements:
      path: Inbox2.entitlements
      properties:
        aps-environment: development
        # Shared container the Share Extension stages shared files/text into for the host
        # app to consume (SharedIncoming). Must match the ShareExtension target's group.
        com.apple.security.application-groups:
          - group.com.inbox2.ios
        # Meeting alarms (MeetingAlarms.swift) post `.timeSensitive` notifications so
        # a meeting reminder cuts through Focus / Do Not Disturb. Unlike CarPlay this
        # is a self-service capability — no Apple grant — but the App ID still has to
        # pick it up, so the first device build after adding it may need one Xcode
        # sign-in to refresh the provisioning profile. Without the entitlement iOS
        # silently downgrades the alarm to a normal notification.
        com.apple.developer.usernotifications.time-sensitive: true
        # Communication notifications: new-mail cards carry the sender's icon (favicon /
        # avatar) as the small inline image on the left, like the desktop card, instead
        # of an attachment iOS blows up to full width on expand (NotificationManager
        # .withSenderIcon). Self-service like time-sensitive; same one-time Xcode sign-in.
        com.apple.developer.usernotifications.communication: true
        # CarPlay (Driving Task app) — add this line to test in the CarPlay Simulator
        # (the sim honors it from the entitlements file with no Apple grant; the Inbox2
        # icon then appears on the CarPlay dashboard, driving CarPlaySceneDelegate's
        # CPListTemplate). Kept OUT by default because a DEVICE build needs Apple to grant
        # this managed entitlement first, and an ungranted entitlement breaks signing:
        #   com.apple.developer.carplay-driving-task: true
    settings:
      base:
        # Explicit bundle id: com.inbox2.Inbox2 (the bundleIdPrefix + target-name
        # default) is registered to another Apple team, and the push entitlement
        # needs an explicit App ID our team (KF53B4S5HD) owns. Must match the
        # API's APNs topic (MobilePushConfig::APNS_DEFAULT_TOPIC).
        PRODUCT_BUNDLE_IDENTIFIER: com.inbox2.ios
        # The InboxCore static lib pulls in the C++ runtime + Apple security stack;
        # -lsqlite3 links the system SQLite for the Swift read layer (InboxStore).
        # -ObjC is required by the MediaPipe GenAI binaries (free-lane Gemma NLU) so
        # their Objective-C categories load.
        OTHER_LDFLAGS: [-lc++, -lsqlite3, -ObjC]
        # Free-lane Kokoro TTS (sherpa-onnx). The bridging header exposes the C API;
        # BRIDGE_KOKORO compiles the real KokoroEngine (KokoroSpeaker.swift) instead of
        # the no-op fallback. Requires the vendored xcframeworks (bin/fetch-sherpa-onnx).
        SWIFT_OBJC_BRIDGING_HEADER: Vendor/swift/SherpaOnnx-Bridging-Header.h
        # Silence the script-sandbox warning for the (resource-only) build.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Automatic signing with the developer's team so device builds/runs work
        # without passing DEVELOPMENT_TEAM/CODE_SIGN_STYLE flags on the CLI or
        # configuring signing by hand in Xcode after each project regeneration.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: KF53B4S5HD
        # The Rust core only builds an arm64 simulator slice (Apple Silicon), so
        # drop the x86_64 sim arch — otherwise the x86_64 link fails. Lets any
        # build tool (XcodeBuildMCP, plain xcodebuild) build the sim cleanly.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
      # Per-config so the Debug flag survives: a base-level
      # SWIFT_ACTIVE_COMPILATION_CONDITIONS override replaces Xcode's default
      # DEBUG condition in Debug builds, silently turning every `#if DEBUG`
      # off (caught when PushRegistrar registered a sandbox APNs token as
      # "production").
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG BRIDGE_KOKORO
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: BRIDGE_KOKORO
    dependencies:
      # The "Send to Inbox2" share-sheet extension, embedded in the app's PlugIns.
      - target: ShareExtension
        embed: true
      # WidgetKit extension hosting the Mail Live Activity UI.
      - target: Inbox2Widgets
        embed: true
      # The shared Rust core (engine + rules), built by
      # ../desktop/core/build-ios-xcframework.sh.
      - framework: ../desktop/target/InboxCore.xcframework
        embed: false
        link: true
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      # Free-lane Kokoro TTS engine: sherpa-onnx + onnxruntime static-lib xcframeworks
      # (fetched by bin/fetch-sherpa-onnx, gitignored). Static libs → link, don't embed.
      - framework: Vendor/sherpa-onnx.xcframework
        embed: false
        link: true
      - framework: Vendor/onnxruntime.xcframework
        embed: false
        link: true
      # ── Bridge free-lane neural engines (optional) ──────────────────────────────
      # The code is already written + gated, so the app builds without these. Add a
      # dependency to light up that free lane (see docs/model-manager.md §6):
      #   NLU — MediaPipe LiteRT / Gemma (auto via `#if canImport(MediaPipeTasksGenAI)`).
      #   Google ships the GenAI inference engine only as CocoaPods prebuilt binaries
      #   (no official SPM), so we use the community SwiftTasksGenAI wrapper, which
      #   binaries as SPM binary targets, so BridgeLLM's existing gate compiles
      #   unchanged. Vendored manifest — see `packages:` at the bottom of this file.
      - package: MediaPipeGenAI
        product: MediaPipeGenAI
      # TTS — Kokoro/sherpa-onnx is vendored (xcframework + SherpaOnnx.swift + bridging
      #   header), not SPM. After vendoring, add BRIDGE_KOKORO to the flags below.

  # Logic tests for the streaming Kokoro lane (segmenter + stream loop). Hostless: it
  # compiles only the pure source under test — no InboxCore / sherpa / AVFoundation — so
  # it runs fast on the simulator without the app or the vendored xcframeworks.
  Inbox2Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources/Audio/KokoroSegmenter.swift
      - path: Sources/Views/EmailReaderCSS.swift
      # Meeting-alarm selection rules + the model they read. Both are pure
      # Foundation/SwiftUI, so they compile in the hostless target (MeetingAlarms
      # itself isn't here — it needs the notification centre and the engine).
      - path: Sources/Models/MeetingAlarmPlan.swift
      - path: Sources/Models/CalendarEvent.swift
      - path: Sources/Models/CalendarClock.swift
      - path: Sources/Models/AccountKey.swift
      # CalendarEvent parses its dates with RelativeTime (Conversation.swift), which
      # drags in the two other pure-Foundation model files it names.
      - path: Sources/Models/Conversation.swift
      - path: Sources/Models/Triage.swift
      # Recipient-autocomplete ranking — pure Foundation, reads Contact/MailAddress
      # out of Conversation.swift above.
      - path: Sources/Models/ContactRanking.swift
      # iPad command palette ranking — pure Foundation.
      - path: Sources/Models/PaletteMatch.swift
      - path: Sources/Models/MailSignature.swift
      - path: Sources/Cloud/CloudDTOs.swift
      # Touch Strip maths + layout merge (treemap, time zones, rain) — pure Foundation.
      - path: Sources/TouchStrip/TouchStripMath.swift
      - path: Tests
      # The shipped email-body bundle + the flattened rendering corpus, bundled into
      # the test so EmailBodyRenderingTests can run every fixture through the REAL
      # bundle in a real WKWebView. Same email-body.js the app ships (Resources/);
      # fixtures.gen.json is generated by bin/gen-email-fixtures.
      - path: Resources/email-body.js
        buildPhase: resources
      - path: ../../fixtures/email/fixtures.gen.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # "Send to Inbox2" share-sheet target. A UI-less app extension: it can't reach the
  # app's encrypted credentials/data dir from its sandbox, so it stages the shared items
  # into the App Group container (SharedIncoming) and opens the host app via the
  # inbox2share:// scheme, which composes a new mail with the files attached. Lightweight —
  # it does NOT link InboxCore or any of the AI engines.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
      # Reused app sources — all pure SwiftUI/Foundation/Security with no engine/core
      # coupling — so the in-extension compose matches the app and domain mail sends via
      # the same CloudClient (no duplicated send logic). See docs/iOS-App.md §7a.
      - path: Sources/Theme/Theme.swift
      - path: Sources/AppConfig.swift
      - path: Sources/Data/Log.swift
      - path: Sources/Cloud/CloudDTOs.swift
      - path: Sources/Cloud/CloudClient.swift
      - path: Sources/Models/MailSignature.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Inbox2
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 12
              NSExtensionActivationSupportsFileWithMaxCount: 12
              NSExtensionActivationSupportsMovieWithMaxCount: 6
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 12
    entitlements:
      path: ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inbox2.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inbox2.ios.ShareExtension
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: KF53B4S5HD
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Rust core only ships an arm64 sim slice, and the host app excludes x86_64 —
        # keep the extension's arch set in sync so the embedded plug-in links cleanly.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

  # Mail Live Activity UI (lock screen + Dynamic Island). Shares LiveActivity/ with the
  # app: the same App Intent type is compiled into both, and iOS runs its perform()
  # in the APP process — INBOX2_WIDGET compiles the engine-touching body out here.
  Inbox2Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: LiveActivity
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Inbox2
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Inbox2Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.inbox2.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inbox2.ios.Widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: KF53B4S5HD
        TARGETED_DEVICE_FAMILY: "1,2"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
      # Per-config (not base) so Xcode's DEBUG condition survives — see the app target.
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG INBOX2_WIDGET
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: INBOX2_WIDGET

# Declare the SPM packages here (uncomment alongside the dependencies above):
packages:
  # Free-lane Gemma NLU engine: Google's prebuilt MediaPipe GenAI binaries (they
  # ship them via CocoaPods only), exposing the MediaPipeTasksGenAI module that
  # BridgeLLM imports. Local, not the upstream SwiftTasksGenAI package: that one
  # carries `.unsafeFlags(["-ObjC"])`, which SwiftPM forbids in a versioned remote
  # dependency — Xcode 27 started enforcing it and the app stopped building. The
  # local manifest is the same three binary targets at the same pinned release
  # (Packages/MediaPipeGenAI/Package.swift has the detail).
  MediaPipeGenAI:
    path: Packages/MediaPipeGenAI
