[package]
name = "inbox2-core"
version = "0.1.0"
description = "Inbox2 provider-agnostic sync engine (shared core for desktop + mobile)"
authors = ["Inbox2"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.77.2"

[lib]
name = "inbox2_core"
# rlib for the desktop crate; staticlib/cdylib enable the future iOS/Android UniFFI
# build without another manifest change.
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Exposes in-memory/store test helpers (e.g. `SyncStore::new_in_memory`) to
# downstream crates' test suites without shipping them in production builds.
test-support = []
# The UniFFI surface for the native iOS/Android apps. Off by default so the
# desktop (Tauri) build never pulls UniFFI; the mobile build enables it. The
# platform logging backend (oslog on Apple, android_logger on Android) is wired in
# via target-specific deps below, gated on the same `mobile-ffi` cfg.
mobile-ffi = ["dep:uniffi", "dep:oslog", "dep:android_logger"]
# Wrap the credential master key in the OS keystore (macOS Keychain / Windows
# DPAPI-backed credential store / Linux Secret Service) instead of a plaintext
# file. Desktop-only: the `keyring` crate has no Android backend and isn't pulled
# into the mobile build, which keeps the file-based key (see crypto.rs).
os-keychain = ["dep:keyring"]

# A version-matched bindgen binary (run with --features mobile-ffi) so the Swift /
# Kotlin bindings are generated by the exact UniFFI the crate compiled against.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["mobile-ffi"]

[dependencies]
uniffi = { version = "0.28", optional = true, features = ["cli"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# User-editable prompt template files (bridge/prompts.toml + data-dir overrides).
toml = "1"
log = "0.4"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "fs", "io-util"] }
async-trait = "0.1"
# On-demand model downloads (three-lane Bridge model manager, bridge/models).
sha2 = "0.10"
# HMAC-SHA256 for Meta X-Hub-Signature-256 verification (sync/meta_push).
hmac = "0.12"
# Unicode NFC for outbound headers + search text (already in the tree via idna).
unicode-normalization = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Unpack distributed model bundles (e.g. the sherpa-onnx Kokoro `.tar.bz2`).
tar = "0.4"
bzip2-rs = "0.1"
imap = "2.4"
native-tls = "0.2"
# SMTP submission for IMAP-account sends. Blocking transport (run in
# spawn_blocking); native-tls matches the IMAP/reqwest TLS stack already linked.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder", "hostname"] }
# ponytail: capped at 0.32 — rusqlite >=0.33 wants libsqlite3-sys >=0.31, but
# tauri-plugin-sql's sqlx pins ^0.30.1, and both `links = "sqlite3"`. Bump once
# tauri-plugin-sql ships a sqlx with a newer libsqlite3-sys.
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
# E2EE mail unsealing (sync/seal.rs) — interop-locked to libsodium (ui/web e2ee.js)
# and the Go MX (mta/internal/seal): sealed box for the DEK, XChaCha20-Poly1305
# for header + body. Audited RustCrypto crates; never hand-rolled.
crypto_box = { version = "0.9", features = ["seal"] }
chacha20poly1305 = "0.10"
crypto_secretbox = "0.1"
# Argon2id KEK derivation for the cloud credential vault (docs/E2EE.md) + zeroing
# of in-memory key material.
argon2 = "0.5"
zeroize = "1"
# OS keystore for the credential master key (desktop only; see `os-keychain`).
# v4 replaced the per-OS feature flags with a single `v1` compat feature (default)
# that bundles the Keychain / Windows credential store / Secret Service backends.
keyring = { version = "4", optional = true }
rand = "0.8"
nanoid = "0.5"
chrono = { version = "0.4", features = ["serde"] }
mailparse = "0.16"
# Charset -> UTF-8 decoding for Gmail body parts (already in-tree via mailparse).
charset = "0.1"
# Quoted-printable bodies for the hand-built Gmail MIME (already in-tree via mailparse).
quoted_printable = "0.5"
thiserror = "2"
parking_lot = "0.12"
base64 = "0.22"
reqwest = { version = "0.12", features = ["rustls-tls", "blocking", "json", "stream", "multipart"], default-features = false }
url = "2"
regex = "1"
# HTML sanitization for quote/subject normalization in threading.
ammonia = "4"
# Downscale oversized inline images before embedding them as data: URIs.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
chrono-tz = "0.10"

# os_log backend so the engine's `log::*` output reaches the unified logging system
# on iOS/macOS (Console.app / `log stream`) for on-site debugging. Apple-only;
# activated by the `mobile-ffi` feature (see `init_logging`).
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
oslog = { version = "0.2", optional = true }

# Android has no system OpenSSL, and native-tls (used by `imap` + `lettre` for the
# IMAP/SMTP TLS stack) falls back to OpenSSL there — unlike iOS/macOS, which use
# Secure Transport. Compile OpenSSL from source (vendored) for the Android targets so
# the mobile build links the same native-tls TLS behavior the desktop/iOS builds have.
# cargo-ndk supplies the NDK clang/ar the openssl build script needs. `android_logger`
# is the Android logcat backend for the engine's `log::*` output (the oslog analog),
# activated by `mobile-ffi`.
[target.'cfg(target_os = "android")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
android_logger = { version = "0.15", optional = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
# `test-util` enables tokio's paused-clock test harness (`start_paused`), so the
# triage-worker timeout test advances 90s instantly instead of waiting in real time.
tokio = { version = "1", features = ["test-util"] }
